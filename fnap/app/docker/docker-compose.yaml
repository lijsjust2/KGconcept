services:
  kgconcept:
    image: lijsfun/kgconcept:latest
    container_name: kgconcept
    ports:
      - "8880:8880"
    volumes:
      # 1) data-share 声明的共享目录: KGconcept/downloads（默认下载位置）
      - "/var/apps/KGconcept/shares/KGconcept/downloads:/app/downloads"
      # 2) 挂载整个 /vol1：用户在"应用设置 → 访问权限"里添加的授权目录（/vol1/... 路径）
      #    在容器内以相同路径可见，应用用户 ACL 由飞牛系统管理
      - "/vol1:/vol1"
      # 3) 飞牛 OpenAPI Unix Socket：后端 Node 用来查询授权目录列表
      - "/var/run/trim_open_gateway_apiscope.socket:/var/run/trim_open_gateway_apiscope.socket"
      # 4) ✅ 改为挂载整个应用安装目录（只读），解决单文件挂载时 docker 误创建目录的致命问题
      #    - 飞牛 cmd/* 脚本把最新 token 写入 /var/apps/KGconcept/.trim_token
      #    - 挂载整个目录后，脚本后续写入/更新的文件（包括新增的）容器里立刻可见，无需重启
      #    - 同时还能读取 .cmd_diagnose.log 诊断日志确认脚本是否真的被执行
      - "/var/apps/KGconcept:/var/apps/KGconcept:ro"
    environment:
      - FNOS_ENV=true
      - DOWNLOAD_DIR=/app/downloads
      - TRIM_APPNAME=KGconcept
      # 显式传 TOKEN_FILE_PATH，让后端和 entrypoint 都用同一个路径
      - TRIM_TOKEN_FILE=/var/apps/KGconcept/.trim_token

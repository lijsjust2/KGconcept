services:
  kgconcept:
    image: lijsfun/kgcc:latest
    container_name: kgconcept
    ports:
      - "8880:8880"
    volumes:
      # data-share 声明的共享目录: KGconcept/downloads
      # 飞牛自动创建路径: /var/apps/{appname}/shares/{share_name}
      - "/var/apps/KGconcept/shares/KGconcept/downloads:/app/downloads"
    environment:
      - FNOS_ENV=true
      - DOWNLOAD_DIR=/app/downloads

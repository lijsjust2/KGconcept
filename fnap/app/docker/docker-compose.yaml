services:
  kgconcept:
    image: lijsfun/kgconcept:latest
    container_name: kgconcept
    ports:
      - "8880:8880"
    volumes:
      # data-share 声明的共享目录名: KGconcept/downloads
      # 飞牛文档说明: 通过 /var/apps/{appname}/share/ 下的软链访问
      - "/var/apps/KGconcept/share/KGconcept/downloads:/app/downloads"
    environment:
      - FNOS_ENV=true
      - DOWNLOAD_DIR=/app/downloads
